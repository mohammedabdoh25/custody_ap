name: custody_app
description: "النظام الشامل لإدارة وصرف وتتبع العهد والمخازن"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # قواعد البيانات المحلية
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  share_plus: ^7.2.1
  pdf: ^3.10.8
  printing: ^5.12.0

  # حزم توليد الـ PDF وتنسيق التواريخ
  #pdf: ^3.10.4
  #printing: ^5.11.1
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Amiri-Regular.ttf

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
