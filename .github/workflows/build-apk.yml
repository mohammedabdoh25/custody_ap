name: Build Flutter Android APK & Capture Logs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies & Build APK with Detailed Logs
        run: |
          mkdir -p build_logs
          flutter pub get > build_logs/pub_get.log 2>&1 || { echo "Pub get failed"; cat build_logs/pub_get.log; exit 1; }
          flutter build apk --release --verbose > build_logs/build_error.log 2>&1 || { echo "Build failed, dumping log:"; cat build_logs/build_error.log; exit 1; }
        continue-on-error: true # لضمان رفع ملف اللوق حتى لو حدث خطأ في البناء

      - name: Upload Build Logs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: build_logs/
